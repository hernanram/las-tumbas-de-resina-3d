<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego 3D Web</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="start-menu" style="position: absolute; top:0; left:0; width: 100vw; height: 100vh; background: url('/portada.jpg') center/cover no-repeat; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="background: rgba(10, 0, 10, 0.85); padding: 50px; border-radius: 20px; border: 2px solid #ffaa00; text-align: center; box-shadow: 0 0 50px rgba(255,170,0,0.5);">
        <h1 style="font-size: 4.5rem; color: #ffaa00; margin-bottom: 20px; text-shadow: 0 0 15px #ffaa00, 2px 2px 5px #000;">LAS TUMBAS DE RESINA</h1>
        <p style="color: #eee; margin-bottom: 30px; font-size: 1.3rem; line-height: 1.8; text-shadow: 1px 1px 2px #000;">WASD para Mover | CLIC IZQUIERDO para Atacar<br>ANTICLIC (Clic Derecho) para Saltar<br>SHIFT para Dash | Q para Curar</p>
        <button id="btn-start" onclick="var m=document.getElementById('start-menu'); if(m){m.style.display='none'; try{m.remove();}catch(e){}} if(window.startGame){window.startGame();}" style="padding: 15px 50px; font-size: 1.8rem; cursor: pointer; background: linear-gradient(45deg, #ff00ff, #8800ff); color: white; border: 2px solid #fff; border-radius: 10px; font-weight: bold; box-shadow: 0 0 20px #ff00ff; transition: transform 0.2s;">EMPEZAR JUEGO</button>
      </div>
    </div>

    <!-- Modal de Game Over / Derrota -->
    <div id="game-over-menu" style="display: none; position: absolute; top:0; left:0; width: 100vw; height: 100vh; background: rgba(15, 0, 0, 0.88); z-index: 100; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px);">
      <div style="background: rgba(25, 5, 5, 0.95); padding: 45px 35px; border-radius: 20px; border: 2px solid #ff3333; text-align: center; box-shadow: 0 0 60px rgba(255, 0, 0, 0.7); max-width: 550px; width: 90%;">
        <h1 style="font-size: 2.8rem; color: #ff3333; margin-bottom: 15px; text-shadow: 0 0 20px #ff0000, 2px 2px 6px #000; letter-spacing: 1px;">
          TU CAMINO LLEGÓ HASTA AQUÍ
        </h1>
        <p style="color: #ddd; margin-bottom: 30px; font-size: 1.2rem; line-height: 1.6; text-shadow: 1px 1px 3px #000;">
          Has caído en las sombras de Las Tumbas de Resina.
        </p>
        <button id="btn-restart" onclick="window.location.reload();" style="padding: 16px 45px; font-size: 1.5rem; cursor: pointer; background: linear-gradient(45deg, #cc0000, #ff4444); color: white; border: 2px solid #ffffff; border-radius: 10px; font-weight: bold; box-shadow: 0 0 25px rgba(255, 0, 0, 0.8); transition: transform 0.2s ease;">
          🔄 EMPEZAR DE NUEVO
        </button>
      </div>
    </div>

    <!-- Este canvas es donde se renderizará el juego 3D -->
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <h1>Iniciando...</h1>
      <div id="health-bar">
        <span>❤️ Vida: </span>
        <span id="health-value">100</span>/100
      </div>
      <div id="amber-counter">
        <span>🟠 Ámbar: </span>
        <span id="amber-value">0</span>
      </div>
      <div id="boss-health-bar" style="display: none;">
        <span>👹 Jefe: </span>
        <span id="boss-health-value">20</span>/20
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
